<script>
/* Renders the repository's own README.md. The file is copied into the publish
   directory at deploy time, so this preview always reflects the committed
   README rather than a second copy of its text. */
(function () {
  'use strict';

  var target = document.getElementById('readme');
  var state = document.getElementById('state');

  var fail = function (msg) {
    if (state) { state.textContent = msg; }
  };

  fetch('/README.md', { cache: 'no-cache' })
    .then(function (res) {
      if (!res.ok) { throw new Error('HTTP ' + res.status); }
      return res.text();
    })
    .then(function (md) {
      if (typeof marked === 'undefined') {
        throw new Error('renderer unavailable');
      }
      marked.setOptions({ gfm: true, breaks: false });
      target.innerHTML = marked.parse(md);

      /* Open every link in the README in a new tab, as GitHub does for
         external references. */
      target.querySelectorAll('a[href^="http"]').forEach(function (a) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      });

      var h1 = target.querySelector('h1');
      if (h1) { document.title = h1.textContent.trim() + ' — README'; }

      if (window.location.hash) {
        var anchor = document.getElementById(window.location.hash.slice(1));
        if (anchor) { anchor.scrollIntoView(); }
      }
    })
    .catch(function (err) {
      fail('Could not load README.md (' + err.message + ').');
    });
}());
</script>
